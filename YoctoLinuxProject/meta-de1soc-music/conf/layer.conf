# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-de1soc-music"
BBFILE_PATTERN_meta-de1soc-music = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-de1soc-music = "6"

LAYERDEPENDS_meta-de1soc-music = "core"
LAYERSERIES_COMPAT_meta-de1soc-music = "scarthgap"
