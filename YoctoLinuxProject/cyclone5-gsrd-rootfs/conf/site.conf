MACHINE = "cyclone5"
DL_DIR = "/home/adriel/gsrd-socfpga/downloads"
SSTATE_DIR ?= "/home/adriel/gsrd-socfpga/sstate_cache"
IMAGE_TYPE:cyclone5 = "gsrd"
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager = "systemd"
require conf/machine/cyclone5-gsrd.conf
PREFERRED_PROVIDER_virtual/kernel = "linux-socfpga-lts"
PREFERRED_VERSION_linux-socfpga-lts = "6.18%"
KBRANCH = "socfpga-6.18.2-lts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-socfpga"
UBOOT_CONFIG:cyclone5 = "cyclone5-socdk"
PREFERRED_VERSION_u-boot-socfpga = "v2026.01%"
UBOOT_BRANCH = "socfpga_v2026.01"
PREFERRED_VERSION_arm-trusted-firmware = "v2.14"
ATF_BRANCH = "socfpga_v2.14.0"
KERNEL_MODULE_PROBECONF = "intel_fcs cfg80211"
module_conf_intel_fcs = "blacklist intel_fcs"
module_conf_cfg80211 = "blacklist cfg80211"
INHERIT += "archiver"
ARCHIVER_MODE[src] = "original"
